plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.timboat.desrecomp'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.timboat.desrecomp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.debug }   // local only, debug-signed
    }
    // libmain.so (the game, ~400+ MB) and libSDL2.so come prebuilt from android/build_so.sh, copied here by
    // android/build_apk.sh. Stored uncompressed and 16 KB aligned in the APK, loaded in place (no copy to
    // /data/app/.../lib).
    sourceSets.main.jniLibs.srcDirs = ['jniLibs']
    packagingOptions {
        jniLibs { useLegacyPackaging false }
        doNotStrip '**/libmain.so'   // build_apk.sh strips its debug info and keeps the symbol table
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
